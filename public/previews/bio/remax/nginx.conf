map $host $agent_slug {
  default "";
  ~^(?<sub>[^.]+)\.imobiliariavip\.com$ $sub;
  equipe.imobiliariavip.com "";
}

server {
  listen 80;
  server_name equipe.imobiliariavip.com *.imobiliariavip.com;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript text/html;

  location / {
    try_files /$agent_slug/index.html /index.html =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
}
